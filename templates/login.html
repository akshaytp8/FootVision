{% extends "base.html" %}
{% block title %}Sign In — FootVision{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-hero">
    <a href="https://chat.whatsapp.com/BgiCMN3p1vI7XVeJLqi9xD?mode=hqctswa" target="_blank">
      <img src="{{ url_for('static', filename='images/logo.png') }}"
           style="height:38px;width:auto;border-radius:50%;" />
    </a>
    <h1 class="hero-title">FootVision</h1>
    <p class="hero-sub">Football Prediction Platform</p>
  </div>

  <div class="auth-card">
    <h2 class="card-title">Welcome Back</h2>
    <p class="card-sub">Sign in to make your predictions</p>

    <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Your username"
               required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" name="password" placeholder="••••"
               required minlength="4" maxlength="4"
               inputmode="numeric" autocomplete="current-password" />
      </div>
      <p style="margin-top:10px;">
    <a href="{{ url_for('auth.forgot_password') }}">
        Forgot PIN?
    </a>
</p>
      <button type="submit" class="btn-submit">Sign In ⚽</button>
    </form>

    <p class="auth-switch">
      No account? <a href="{{ url_for('auth.register') }}">Create one here</a>
    </p>
  </div>
</div>
{% endblock %}
