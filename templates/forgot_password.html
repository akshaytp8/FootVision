{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="auth-wrapper">

  <div class="auth-card">

    <h2>Password Recovery</h2>

    <form method="POST">

      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          required>
      </div>

      <div class="form-group">
        <label>
          What is your favorite teacher's name?
        </label>

        <input
          type="text"
          name="answer"
          required>
      </div>

      <div class="form-group">
        <label>New 4-Digit PIN</label>

        <input
          type="password"
          name="new_password"
          pattern="\d{4}"
          minlength="4"
          maxlength="4"
          required>
      </div>

      <button
        type="submit"
        class="btn-submit">

        Reset PIN
      </button>

    </form>

  </div>

</div>

{% endblock %}
